services:
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - lunisoft

  ts-starter-backend:
    # Don't start backend in dev — run it from your IDE instead.
    # Profiles require to be run with the argument "docker compose --profile prod up -d"
    profiles:
      - prod

  ts-starter-frontend:
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  caddy-data:
  caddy-config: